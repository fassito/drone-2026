; Plantilla PlatformIO para Drone-2026 (ESP32 DevKit V1)
; Placa: ESP32-WROOM-32 (esp32dev)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Partición por defecto de 4 MB. Usar "min_spiffs.csv" si se necesita espacio para datos/telemetría.
board_build.partitions = default.csv

build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; Tick de RTOS a 1 kHz para que el bucle de control sea determinista
    -D CONFIG_FREERTOS_HZ=1000

; Añadir aquí las librerías cuando el código las requiera:
; lib_deps =
;     bblanchon/ArduinoJson @ ^7.0.0
