; Drone-2026 — PlatformIO
; Placa: ESP32 DevKit V1 (ESP32-WROOM-32, 30 pines)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200

; Partición por defecto de 4 MB
board_build.partitions = default.csv

build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; Tick de RTOS a 1 kHz para un bucle de control determinista
    -D CONFIG_FREERTOS_HZ=1000

lib_deps =
    plerup/EspSoftwareSerial @ ^8.2.0
    adafruit/Adafruit BMP3XX Library @ ^2.1.4
    adafruit/Adafruit INA219 @ ^1.2.3
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
